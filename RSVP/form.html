<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding Guest Menu Form</title>
    <link rel="stylesheet" href="formstyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <form action="#" method="post">

        <!-- Name -->
        <fieldset>
            <legend>Guest Details</legend>
            <label>
                Name:
                <input type="text" name="guest_name" required>
            </label>
        </fieldset>
                <fieldset>
                    <sub>Are you able to join us?</sub>
                    <label>
                        <input type="checkbox" name="coming" value="Yes">
                        Accept with pleasure
                    </label>
                    <label>
                        <input type="checkbox" name="coming" value="No">
                        Decline, will be there in spirit
                    </label>
                </fieldset>

        <div id="extraFields" style="display: none">

        <!-- Starter -->
        <fieldset>
            <legend>Wedding Menu</legend>
            <div class="border-image"></div>
            <sub>Starter</sub>
            <label>
                <input type="checkbox" name="starter[]" value="Pork">
                Confit Belly of Pork
            </label>
            <label>
                <input type="checkbox" name="starter[]" value="Bhaji">
                Auberine & Spinach Bhaji (Vg)
            </label>

        <!-- Main -->
            <sub>Main Course</sub>
            <label>
                <input type="checkbox" name="main[]" value="Beef">
                Fillet of Beef Wellington
            </label>
            <label>
                <input type="checkbox" name="main[]" value="Fish">
                Pan-fried Sea Bream
            </label>
            <label>
                <input type="checkbox" name="main[]" value="Veg">
                Wild Mushroom, Chestnut & Thyme Pithivier (V)
            </label>

        <!-- Dessert -->
            <sub>Dessert</sub>
            <label>
                <input type="checkbox" name="dessert[]" value="Trio">
                Trio: Warm Chocolate Fondant, Vanilla Panna Cotta & Lemon Posset (V)
            </label>
        </fieldset>


        <!-- Extras -->
        <fieldset>
            <legend>Extras</legend>
            <label>
                Special Dietry Requirements?
                <input type="text" name="diet">
            </label>
            <label>
                Any song requests?
                <input type="text" name="diet">
            </label>
            <sub>Favourite Wine?</sub>
            <label>
                <input type="checkbox" name="main[]" value="White">
                White
            </label>
            <label>
                <input type="checkbox" name="main[]" value="Red">
                Red
            </label>
            <label>
                <input type="checkbox" name="main[]" value="Rose">
                Rose
            </label>
            <label>
                <input type="checkbox" name="main[]" value="None">
                None
            </label>
        </fieldset>


        <!-- Accommodation -->
        <fieldset>
            <legend>Accommodation</legend>
            There are a number of rooms at the venue, we have allocated a room to you if you wish!
            Would you like to stay the night?
            <label>
                <input type="checkbox" name="accommodation" value="Yes">
                Yes please!
            </label>
            <label>
                <input type="checkbox" name="accommodation" value="No">
                Sorry, I can't stay.
            </label>
        </fieldset>

        </div>

        <button type="submit">Submit</button>

    </form>
    <script src="rsvp.js"></script>

</body>
</html>
