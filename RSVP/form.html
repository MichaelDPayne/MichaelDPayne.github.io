<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding Guest Menu Form</title>
    <link rel="stylesheet" href="formstyle.css">
</head>
<body>

    <h1>Wedding Guest Details</h1>

    <form action="#" method="post">

        <!-- Name -->
        <fieldset>
            <legend>Guest Name</legend>
            <label>
                Name:
                <input type="text" name="guest_name" required>
            </label>
        </fieldset>

        <!-- Starter -->
        <fieldset>
            <legend>Wedding Menu</legend>
            <sub>Starter</sub>
            <label>
                <input type="checkbox" name="starter[]" value="Soup">
                Soup
            </label>
            <label>
                <input type="checkbox" name="starter[]" value="Salad">
                Salad with cream
            </label>

        <!-- Main -->
            <sub>Main Course</sub>
            <label>
                <input type="checkbox" name="main[]" value="Chicken">
                Chicken
            </label>
            <label>
                <input type="checkbox" name="main[]" value="Beef">
                Beef
            </label>
            <label>
                <input type="checkbox" name="main[]" value="Vegetarian">
                Vegetarian
            </label>

        <!-- Dessert -->
            <sub>Dessert</sub>
            <label>
                <input type="checkbox" name="dessert[]" value="Cheesecake">
                Cheesecake
            </label>
            <label>
                <input type="checkbox" name="dessert[]" value="Chocolate Cake">
                Chocolate Cake
            </label>
            <label>
                <input type="checkbox" name="dessert[]" value="Fruit Salad">
                Fruit Salad
            </label>

        <!-- Accommodation -->
        <fieldset>
            <legend>Accommodation</legend>
            <label>
                <input type="checkbox" name="accommodation" value="Yes">
                I require accommodation
            </label>
        </fieldset>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
